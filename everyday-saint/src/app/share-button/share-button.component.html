<button 
  class="share-button"
  [class.share-button--success]="shareStatus === 'success'"
  [class.share-button--error]="shareStatus === 'error'"
  (click)="share()"
  [attr.aria-label]="getAriaLabel()"
  type="button">
  
  <!-- Share icon (default state) -->
  <svg 
    *ngIf="shareStatus === 'idle'"
    class="share-button__icon" 
    xmlns="http://www.w3.org/2000/svg" 
    viewBox="0 0 24 24" 
    fill="none" 
    stroke="currentColor" 
    stroke-width="2" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    aria-hidden="true">
    <circle cx="18" cy="5" r="3"></circle>
    <circle cx="6" cy="12" r="3"></circle>
    <circle cx="18" cy="19" r="3"></circle>
    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
    <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
  </svg>

  <!-- Success icon (checkmark) -->
  <svg 
    *ngIf="shareStatus === 'success'"
    class="share-button__icon" 
    xmlns="http://www.w3.org/2000/svg" 
    viewBox="0 0 24 24" 
    fill="none" 
    stroke="currentColor" 
    stroke-width="2" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    aria-hidden="true">
    <polyline points="20 6 9 17 4 12"></polyline>
  </svg>

  <!-- Error icon (X) -->
  <svg 
    *ngIf="shareStatus === 'error'"
    class="share-button__icon" 
    xmlns="http://www.w3.org/2000/svg" 
    viewBox="0 0 24 24" 
    fill="none" 
    stroke="currentColor" 
    stroke-width="2" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    aria-hidden="true">
    <line x1="18" y1="6" x2="6" y2="18"></line>
    <line x1="6" y1="6" x2="18" y2="18"></line>
  </svg>
</button>
