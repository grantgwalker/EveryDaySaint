<main class="app">
  <header class="app__header">
    <h1 class="app__title">Saint of the Day</h1>
    <p class="app__subtitle">Church of England</p>
  </header>

  <div class="app__content">
    <!-- Loading state -->
    <div *ngIf="isLoading" class="app__loading">
      <div class="app__spinner"></div>
      <p>Loading today's saint...</p>
    </div>

    <!-- Error state -->
    <div *ngIf="errorMessage && !isLoading" class="app__error">
      <p class="app__error-message">{{ errorMessage }}</p>
    </div>

    <!-- Saint content -->
    <div *ngIf="saint && !isLoading" class="app__saint">
      <app-saint-card [saint]="saint" [date]="date"></app-saint-card>
      
      <div class="app__actions">
        <app-share-button [saint]="saint" [date]="date"></app-share-button>
        <app-refresh-button (refresh)="onRefresh()"></app-refresh-button>
      </div>
    </div>
  </div>
</main>

<router-outlet />
